<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EROTICASECRETS | Find Your Desire</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        plum: {
                            900: '#1a0916',
                            950: '#120510',
                            800: '#2A1024',
                            700: '#3B1533'
                        },
                        gold: {
                            400: '#E5C158',
                            500: '#D4AF37',
                            600: '#B89728'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Swiper.js for Image Carousels -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        h1, h2, h3, .brand-font { font-family: 'Cinzel', serif; }
    </style>
</head>
<body class="bg-plum-950 text-neutral-100 min-h-screen pb-16 selection:bg-gold-500 selection:text-plum-950">

    <!-- Top Luxury Header -->
    <header class="sticky top-0 z-50 backdrop-blur-md bg-plum-950/80 border-b border-gold-500/20 px-4 py-3">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-gold-600 to-gold-400 flex items-center justify-center text-plum-950 font-bold shadow-lg shadow-gold-500/20">
                    <i class="fa-solid fa-key text-xs"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-wider text-gold-400 leading-none">EROTICASECRETS</h1>
                    <span class="text-[10px] tracking-widest text-neutral-400 uppercase">Find Your Desire</span>
                </div>
            </div>
            <button onclick="openReviewsModal()" class="text-xs bg-plum-800 border border-gold-500/30 text-gold-400 px-3 py-1.5 rounded-full hover:bg-gold-500 hover:text-plum-950 transition-all font-medium flex items-center gap-1.5">
                <i class="fa-solid fa-star text-[10px]"></i> Reviews
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto px-4 pt-6 space-y-6">

        <!-- Banner / Welcome Note -->
        <div class="relative overflow-hidden rounded-2xl bg-gradient-to-br from-plum-800 to-plum-900 border border-gold-500/30 p-5 shadow-2xl">
            <div class="absolute -right-6 -bottom-6 w-32 h-32 bg-gold-500/10 rounded-full blur-2xl pointer-events-none"></div>
            <h2 class="text-xl font-bold text-gold-400 mb-1">Exclusive Collection</h2>
            <p class="text-xs text-neutral-300 leading-relaxed mb-4">Tap any piece to inquire or order securely & discreetly via WhatsApp.</p>
            <div class="flex items-center gap-2 text-[11px] text-gold-500/90 font-medium bg-plum-950/50 py-1.5 px-3 rounded-lg border border-gold-500/20 w-fit">
                <i class="fa-solid fa-shield-halved"></i> 100% Confidential Delivery & Packaging
            </div>
        </div>

        <!-- Product Feed -->
        <div id="product-container" class="space-y-6">
            <!-- Dynamic Products Injected via JS -->
        </div>

    </main>

    <!-- Reviews Modal -->
    <div id="reviews-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-plum-900 w-full max-w-lg max-h-[85vh] rounded-t-3xl sm:rounded-2xl border border-gold-500/30 flex flex-col shadow-2xl overflow-hidden">
            <div class="p-4 border-b border-plum-800 flex items-center justify-between">
                <h3 class="font-bold text-gold-400 text-base">Client Experiences</h3>
                <button onclick="closeReviewsModal()" class="w-8 h-8 rounded-full bg-plum-800 text-neutral-400 hover:text-white flex items-center justify-center">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="p-4 overflow-y-auto space-y-4 flex-1">
                <!-- Add Review Form -->
                <form id="review-form" onsubmit="submitReview(event)" class="bg-plum-950/60 p-3.5 rounded-xl border border-gold-500/20 space-y-3">
                    <h4 class="text-xs font-bold text-gold-400 uppercase tracking-wider">Leave a Review</h4>
                    <div class="flex items-center gap-2">
                        <span class="text-xs text-neutral-400">Rating:</span>
                        <div class="flex gap-1 text-gold-400 cursor-pointer" id="star-rating-input">
                            <i class="fa-solid fa-star" data-value="1" onclick="setRating(1)"></i>
                            <i class="fa-solid fa-star" data-value="2" onclick="setRating(2)"></i>
                            <i class="fa-solid fa-star" data-value="3" onclick="setRating(3)"></i>
                            <i class="fa-solid fa-star" data-value="4" onclick="setRating(4)"></i>
                            <i class="fa-solid fa-star" data-value="5" onclick="setRating(5)"></i>
                        </div>
                    </div>
                    <input type="text" id="reviewer-name" placeholder="Your Name or Initials" required class="w-full bg-plum-900 border border-plum-800 rounded-lg px-3 py-2 text-xs text-neutral-100 focus:outline-none focus:border-gold-500">
                    <textarea id="reviewer-text" placeholder="Share your experience..." rows="2" required class="w-full bg-plum-900 border border-plum-800 rounded-lg px-3 py-2 text-xs text-neutral-100 focus:outline-none focus:border-gold-500 resize-none"></textarea>
                    <button type="submit" class="w-full py-2 bg-gradient-to-r from-gold-600 to-gold-400 text-plum-950 font-bold rounded-lg text-xs shadow-md">Post Review</button>
                </form>
                <!-- Reviews List -->
                <div id="reviews-list" class="space-y-3">
                    <!-- Loaded dynamically -->
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="mt-12 text-center text-neutral-500 text-[11px] pb-6">
        <p>&copy; 2026 Eroticasecrets. All rights reserved.</p>
        <p class="mt-1 text-gold-500/60">Discreet • Private • Luxurious</p>
    </footer>

    <!-- Swiper JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        // CONFIGURATION: Replace with your actual WhatsApp phone number (Country code + number, no + sign)
        let whatsappNumber = "254712345678";

        // Product Catalog Data
        const products = [
            {
                id: 1,
                title: "Silk Eye Mask & Satin Restraints",
                price: "KSh 3,500",
                status: "NEW ARRIVAL",
                badgeClass: "bg-amber-500/20 text-amber-300 border-amber-500/30",
                images: [
                    "https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?w=600&q=80",
                    "https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?w=600&q=80"
                ]
            },
            {
                id: 2,
                title: "Luxury Contour Wand & Massage Oil",
                price: "KSh 6,800",
                status: "IN STOCK",
                badgeClass: "bg-emerald-500/20 text-emerald-300 border-emerald-500/30",
                images: [
                    "https://images.unsplash.com/photo-1608248597359-974b0870badf?w=600&q=80",
                    "https://images.unsplash.com/photo-1556228720-195a672e8a03?w=600&q=80"
                ]
            },
            {
                id: 3,
                title: "Velvet Sensory Paddle & Blindfold",
                price: "KSh 4,200",
                status: "OUT OF STOCK",
                badgeClass: "bg-rose-500/20 text-rose-300 border-rose-500/30",
                images: [
                    "https://images.unsplash.com/photo-1512496015851-a90fb38ba796?w=600&q=80"
                ]
            }
        ];

        // Load Click Analytics & Reviews from LocalStorage
        let clickCounts = JSON.parse(localStorage.getItem('eroticasecrets_clicks') || '{}');
        let reviews = JSON.parse(localStorage.getItem('eroticasecrets_reviews') || JSON.stringify([
            { name: "S. K.", rating: 5, text: "Extremely discreet packaging and wonderful quality. Arrived right on time!", date: "Yesterday" },
            { name: "M. N.", rating: 5, text: "Top-notch customer service on WhatsApp. Very smooth experience.", date: "3 days ago" }
        ]));

        let currentSelectedRating = 5;

        function renderProducts() {
            const container = document.getElementById('product-container');
            container.innerHTML = products.map(product => {
                let clicks = clickCounts[product.id] || 0;
                let isOutOfStock = product.status === "OUT OF STOCK";
                
                let buttonHTML = isOutOfStock 
                    ? `<button onclick="handleWhatsAppOrder(${product.id}, '${product.title}', true)" class="w-full py-3 bg-plum-800/80 hover:bg-plum-700 text-gold-400 border border-gold-500/30 font-bold rounded-xl text-xs flex items-center justify-center gap-2 transition-all shadow-lg">
                         <i class="fa-brands fa-whatsapp text-sm"></i> Request Restock Notification
                       </button>`
                    : `<button onclick="handleWhatsAppOrder(${product.id}, '${product.title}', false)" class="w-full py-3 bg-gradient-to-r from-gold-600 via-gold-500 to-gold-400 hover:opacity-95 text-plum-950 font-bold rounded-xl text-xs flex items-center justify-center gap-2 transition-all shadow-lg shadow-gold-500/10">
                         <i class="fa-brands fa-whatsapp text-sm"></i> Order via WhatsApp (${product.price})
                       </button>`;

                let slidesHTML = product.images.map(img => `
                    <div class="swiper-slide bg-plum-950">
                        <img src="${img}" alt="${product.title}" class="w-full h-64 object-cover">
                    </div>
                `).join('');

                return `
                    <div class="bg-plum-900/90 rounded-2xl border border-gold-500/20 overflow-hidden shadow-xl backdrop-blur-sm">
                        <!-- Image Carousel -->
                        <div class="swiper product-swiper-${product.id} relative">
                            <div class="swiper-wrapper">
                                ${slidesHTML}
                            </div>
                            <div class="swiper-pagination"></div>
                            <div class="absolute top-3 left-3 z-10 px-2.5 py-1 rounded-full text-[10px] font-bold tracking-wider border backdrop-blur-md ${product.badgeClass}">
                                ${product.status}
                            </div>
                        </div>
                        <!-- Product Info -->
                        <div class="p-4 space-y-3">
                            <div class="flex items-start justify-between">
                                <h3 class="font-bold text-sm text-neutral-100">${product.title}</h3>
                                <span class="text-gold-400 font-bold text-sm">${product.price}</span>
                            </div>
                            ${buttonHTML}
                            <div class="flex items-center justify-between text-[10px] text-neutral-400 pt-1">
                                <span><i class="fa-solid fa-fire text-gold-500"></i> ${clicks} inquiries</span>
                                <span class="text-gold-500/80">Discreet Inquiry</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            // Initialize Swiper for each product card
            products.forEach(product => {
                new Swiper(`.product-swiper-${product.id}`, {
                    pagination: {
                        el: `.product-swiper-${product.id} .swiper-pagination`,
                        clickable: true,
                    },
                    loop: product.images.length > 1
                });
            });
        }

        function handleWhatsAppOrder(productId, title, isRestock) {
            // Increment Click Analytics
            clickCounts[productId] = (clickCounts[productId] || 0) + 1;
            localStorage.setItem('eroticasecrets_clicks', JSON.stringify(clickCounts));
            renderProducts();

            // Format WhatsApp Message
            let message = isRestock 
                ? `Hello Eroticasecrets, I would like to be notified when "${title}" is back in stock.` 
                : `Hello Eroticasecrets, I would like to order: *${title}*. Please share delivery details.`;
            
            let url = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`;
            window.open(url, '_blank');
        }

        function openReviewsModal() {
            document.getElementById('reviews-modal').classList.remove('hidden');
            renderReviews();
        }

        function closeReviewsModal() {
            document.getElementById('reviews-modal').classList.add('hidden');
        }

        function setRating(rating) {
            currentSelectedRating = rating;
            const stars = document.querySelectorAll('#star-rating-input i');
            stars.forEach((star, index) => {
                if (index < rating) {
                    star.classList.remove('fa-regular');
                    star.classList.add('fa-solid');
                } else {
                    star.classList.remove('fa-solid');
                    star.classList.add('fa-regular');
                }
            });
        }

        function submitReview(event) {
            event.preventDefault();
            const name = document.getElementById('reviewer-name').value;
            const text = document.getElementById('reviewer-text').value;

            reviews.unshift({
                name: name,
                rating: currentSelectedRating,
                text: text,
                date: "Just now"
            });

            localStorage.setItem('eroticasecrets_reviews', JSON.stringify(reviews));
            document.getElementById('review-form').reset();
            setRating(5);
            renderReviews();
        }

        function renderReviews() {
            const list = document.getElementById('reviews-list');
            list.innerHTML = reviews.map(rev => {
                let starsHTML = '';
                for(let i=0; i<5; i++) {
                    starsHTML += `<i class="fa-solid fa-star ${i < rev.rating ? 'text-gold-400' : 'text-neutral-700'} text-[10px]"></i>`;
                }
                return `
                    <div class="bg-plum-950/40 border border-plum-800 rounded-xl p-3 space-y-1">
                        <div class="flex items-center justify-between">
                            <span class="font-bold text-xs text-neutral-200">${rev.name}</span>
                            <span class="text-[10px] text-neutral-500">${rev.date}</span>
                        </div>
                        <div class="flex gap-0.5">${starsHTML}</div>
                        <p class="text-xs text-neutral-300 pt-1">${rev.text}</p>
                    </div>
                `;
            }).join('');
        }

        // Initial render on load
        renderProducts();
        setRating(5);
    </script>
</body>
</html>
